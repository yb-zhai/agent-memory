    ? `Hindsight ${S.bank || ''} · 记忆 ${fmt(S.counts.units)} · 关系 ${fmt(S.counts.links)} · 召回 ${fmt(S.counts.traces)} · CE 2.6s · embed 46 texts/s`
    : `memory_units ${fmt(S.counts.units)} · memory_links ${fmt(S.counts.links)} · link_bridge ${fmt(S.counts.bridges)} · recall_trace ${fmt(S.counts.traces)} · CE 2.6s · embed 46 texts/s · DSH · Hindsight 1.2.0`;
  ctx.font = MONO(400, 10.5);
  const mw = ctx.measureText(msg).width;
  ctx.save(); ctx.beginPath(); ctx.rect(24, y, W - 48, 22); ctx.clip();
  const off = (t * 34) % (mw + 260);
  txt(msg, W - 24 - off, row2Y, MONO(400, 10.5), hexA(C.dim, .95));
  txt(msg, W - 24 - off + mw + 260, row2Y, MONO(400, 10.5), hexA(C.dim, .95));
  ctx.restore();
  // ---------- 进度条：随机心电图（ECG） ----------
  {
    const bx = 24, bw = W - 48 - 34, by = H - 16;

    /* 心电谱：每个心搏 = P + QRS + T，位置/幅度/有无 T 波都随机；生成一次后缓存 */
    const ecgKey = bx + '|' + bw + '|' + by;
    if (!S.__ecg || S.__ecg.key !== ecgKey) {
      const beats = [];
      for (let x = 46; x < bw - 26; x += 84 + Math.random() * 108) {
        beats.push({ x, amp: 5.4 + Math.random() * 1.6, tw: Math.random() < .82 ? 1 : 0 });
      }
      const g = (u, c, w) => Math.exp(-Math.pow((u - c) / w, 2));
      const pts = new Float32Array(bw + 2);
      for (let px = 0; px <= bw; px++) {
        let dy = Math.sin(px * .9) * .16;                    // 极轻的基线毛刺
        for (const b of beats) {
          const u = (px - b.x) / 26;
          if (u < -1.4 || u > 3.4) continue;
          dy += b.amp * (
            .17 * g(u, -.34, .16)                            // P 波
            - .20 * g(u, -.11, .085)                         // Q
            + 1.00 * g(u, 0, .070)                           // R（尖峰）
            - .60 * g(u, .14, .095)                          // S
            + .40 * b.tw * g(u, .70, .26)                    // T 波
          );
        }
        pts[px] = dy;
      }
      S.__ecg = { key: ecgKey, pts };
    }
    const ecg = S.__ecg.pts;
    const ecgY = px => by + ecg[Math.max(0, Math.min(bw, Math.round(px - bx)))];
    const pathEcg = (x0, x1) => {
      const a = Math.max(bx, Math.min(bx + bw, x0)), b2 = Math.max(bx, Math.min(bx + bw, x1));
      if (b2 <= a) return false;
      ctx.beginPath();
      for (let px = a; px <= b2; px += 1) {
        const yy = ecgY(px);
        if (px === a) ctx.moveTo(px, yy); else ctx.lineTo(px, yy);
      }
      return true;
    };
    // 轨道（心电细线）
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.070)'; ctx.lineWidth = .8;
    pathEcg(bx, bx + bw); ctx.stroke();

    const STEPS = 7, CYC = 12.0;                 // 12 秒走完 7 段，每段「冲一下 + 停一下」
    const tt = t % CYC;
    const seg = CYC / STEPS;
    const idx = Math.min(STEPS - 1, Math.floor(tt / seg));
    const frac = (tt - idx * seg) / seg;          // 段内进度 0..1
    const MOVE = .48;                             // 前 48% 冲到位，剩下停顿
    const mv = frac < MOVE ? ease(frac / MOVE) : 1;
    const head = bx + ((idx + mv) / STEPS) * bw;
    const hy = ecgY(head);                       // 头部所在心电高度

    // 彩虹：色相沿轨道递进，并且随时间整体流动
    const hueAt = px => (t * 55 + ((px - bx) / bw) * 300) % 360;

    // 已走过的主体（线体比原来细 1px：2px → 1px，外圈辉光同步收窄 5px → 3.5px）
    const bg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    for (let q = 0; q <= 8; q++) {
      const qx = bx + (q / 8) * bw;
      bg.addColorStop(q / 8, `hsla(${hueAt(qx).toFixed(0)}, 92%, 62%, ${(.40 + .28 * (q / 8)).toFixed(2)})`);
    }
    if (head > bx) {
      ctx.save();
      ctx.shadowColor = `hsla(${hueAt(head).toFixed(0)}, 95%, 65%, .50)`;
      ctx.shadowBlur = 8;
      ctx.strokeStyle = bg; ctx.lineWidth = 3;
      pathEcg(bx, head); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = bg; ctx.lineWidth = .5;
      pathEcg(bx, head); ctx.stroke();
    }

    // 发光头的拖尾：头部往后 90px 的彗尾，越靠近头越亮，跟着心电起伏
    const TAIL = 90 + 60 * (frac < MOVE ? (1 - mv) : 1);
    if (head - TAIL > bx) {
      const tg = ctx.createLinearGradient(head - TAIL, 0, head, 0);
      tg.addColorStop(0, `hsla(${hueAt(head).toFixed(0)}, 95%, 68%, 0)`);
      tg.addColorStop(.45, `hsla(${hueAt(head).toFixed(0)}, 95%, 68%, .18)`);
      tg.addColorStop(.82, `hsla(${hueAt(head).toFixed(0)}, 96%, 72%, .55)`);
      tg.addColorStop(1, `hsla(${hueAt(head).toFixed(0)}, 98%, 80%, .95)`);
      ctx.save();
      ctx.shadowColor = `hsla(${hueAt(head).toFixed(0)}, 96%, 70%, .85)`;
      ctx.shadowBlur = 13;
      ctx.strokeStyle = tg; ctx.lineWidth = 4.5;
      pathEcg(head - TAIL, head); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = tg; ctx.lineWidth = 1.6;
      pathEcg(head - TAIL, head); ctx.stroke();
      ctx.restore();
    }

    // 分段刻度（跟着心电高度）
    for (let k = 1; k < STEPS; k++) {
      const px = bx + (k / STEPS) * bw;
      ctx.fillStyle = hexA('#ffffff', k <= idx ? .18 : .07);
      ctx.fillRect(px - .5, ecgY(px) - 4, 1, 8);
    }

    // 停顿瞬间的爆点：单次闪光 + 火花
    const pf = frac >= MOVE ? Math.max(0, 1 - (frac - MOVE) / .34) : 0;
    if (pf > 0) {
      const pr = 4 + 34 * (1 - pf);
      ctx.save();
      ctx.shadowColor = `hsla(${hueAt(head).toFixed(0)}, 95%, 68%, ${(.85 * pf).toFixed(2)})`;
      ctx.shadowBlur = 16 * pf;
      ctx.strokeStyle = `hsla(${hueAt(head).toFixed(0)}, 95%, 70%, ${(.9 * pf).toFixed(2)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(head, hy + .5, pr, 0, 6.3); ctx.stroke();
      ctx.restore();
      for (let k = 0; k < 9; k++) {
        const ang = (k / 9) * 6.283 + idx * 1.7;
        const dist = (1 - pf) * (22 + (k % 3) * 12);
        const sx = head + Math.cos(ang) * dist;
        const sy = hy + Math.sin(ang) * dist * .8;
        ctx.fillStyle = `hsla(${(hueAt(head) + (k % 3) * 55).toFixed(0) % 360}, 95%, 70%, ${(.85 * pf).toFixed(2)})`;
        ctx.beginPath(); ctx.arc(sx, sy, 1.3 * pf + .4, 0, 6.3); ctx.fill();
      }
    }

    // 头部亮点
    const pulse = .55 + .45 * Math.sin(t * 6.0);
    ctx.save();
    ctx.shadowColor = `hsla(${hueAt(head).toFixed(0)}, 95%, 70%, .95)`; ctx.shadowBlur = 10 + 6 * pulse;
    ctx.fillStyle = hexA('#ffffff', .92);
    ctx.beginPath(); ctx.arc(head, hy + .5, 2.1 + .8 * pulse + 1.6 * pf, 0, 6.3); ctx.fill();
    ctx.restore();
    ctx.restore();
  }
}


/* 记忆库掉线时的一条明确提示（否则整屏都是 0，容易以为面板坏了） */
function dbBanner(t) {
  const x = NET.x + 16, y = NET.y + 56, w = NET.w - 32, h = 34;
  const pulse = .55 + .25 * Math.sin(t * 3);
  rr(x, y, w, h, 8);
  ctx.fillStyle = 'rgba(248,113,113,.10)'; ctx.fill();
  ctx.strokeStyle = hexA(C.red, .45 * pulse); ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = hexA(C.red, .95);
  ctx.beginPath(); ctx.arc(x + 18, y + h / 2, 3.4, 0, 6.3); ctx.fill();
  txt('记忆库未连接 · 数据源没有响应', x + 32, y + 22, F(400, 12.5), hexA(C.red, .95));
  const msg = '面板照常运行，恢复后自动补数据（检查 Hindsight API 或 PostgreSQL）';
  txt(msg, x + w - 16, y + 22, F(400, 11), hexA(C.mute, .9), 'right');
}

/* 没有 Hindsight 且本地库为空时的提示：这时整屏都是 0，不解释一句
   就等于让用户以为插件坏了。数据一出现（units > 0）或切到 hybrid 自动消失。 */
function emptyBanner(t) {
  const x = NET.x + 16, y = NET.y + 56, w = NET.w - 32, h = 34;
  const pulse = .55 + .25 * Math.sin(t * 2.2);
  rr(x, y, w, h, 8);
  ctx.fillStyle = 'rgba(251,191,36,.07)'; ctx.fill();
  ctx.strokeStyle = hexA(C.amber, .30 + .12 * pulse); ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = hexA(C.amber, .95);
  ctx.beginPath(); ctx.arc(x + 18, y + h / 2, 3.4, 0, 6.3); ctx.fill();
  const title = '本地库为空 · 未接入 Hindsight';
  txt(title, x + 32, y + 22, F(600, 12.5), hexA(C.amber, .95));
  const msg = '面板只展示已有数据；本地引擎不会自动积累 —— 接入 Hindsight 或向 /remember 写入';
  const room = w - 32 - measure(title, F(600, 12.5)) - 24;
  if (room > 60) txt(fitText(msg, room, F(400, 11)), x + w - 16, y + 22, F(400, 11), hexA(C.dim, .95), 'right');
}

/* 统一的呼吸相位：落点辉光与「正在被点亮的召回片段」共用同一个频率，
   这样球体上的光和卡片的微光看起来是同一口气。 */
function breath(t, ph) { return .5 + .5 * Math.sin(t * 3 + (ph || 0) * .7); }

/* ---------------- 召回片段轮换点亮 ----------------
   规则：
   - 只有在图里找得到本地节点的片段才有资格（Hindsight 片段没有本地节点，直接跳过）；
   - 每片点亮 3 秒：0.6s 淡入 + 1.8s 保持 + 0.6s 淡出，缓动曲线，不跳变；
   - 相邻片段不连续点亮（下一片与当前卡片序号至少差 2），避免并排一起闪；
   - 优先挑选「邻居里种子/1 跳/2 跳更多」的节点（rich 越大越优先）。 */
const SPOT = { key: '', list: [], cur: -1, nodeId: '', start: 0, level: 0 };
const SPOT_PERIOD = 3000, SPOT_IN = 600, SPOT_HOLD = 1800;
const easeInOut = (x) => { const v = clamp(x); return v * v * (3 - 2 * v); };

function updateSpotlight(now) {
  const a = S.anim;
  if (!a || !a.results || !a.results.length) {
    SPOT.cur = -1; SPOT.nodeId = ''; SPOT.level = 0; return;
  }
  const key = a.query + '|' + Math.round(a.t0 || 0);
  if (SPOT.key !== key) {
    // 节点还没做 3D 投影（sx 未生成）时先别建列表，否则这一帧会筛出空表、
    // 然后 key 已经锁住，就再也不会重建 —— 表现为"轮换完全不工作"。
    if (!nodes.length || nodes[0].sx === undefined) return;
    SPOT.key = key;
    const list = [];
    for (let i = 0; i < Math.min(a.results.length, CARD_COUNT); i++) {
      const r = a.results[i];
      if (!r || r.source === 'hindsight') continue;
      const n = r.id ? nbyId.get(String(r.id)) : null;
      if (!n) continue;
      // 轮换点亮的就是「这张片段自己在图里的那个节点」：
      // 它平时是暗点，轮到时被光晕临时点亮 —— 这才是"把召回片段点亮"的观感。
      // （Hindsight 片段没有本地节点，前面已经跳过。）
      // 只排除投影跑到星云可视区之外的节点，否则光环画在裁剪区外等于没画。
      const spread = Math.min(NET.w, NET.h) * .52;
      if (!(Math.hypot(n.sx - NET.cx, n.sy - NET.cy) <= spread)) continue;
      // 「种子/1 跳/2 跳 更多的优先」：看这个节点在点亮子图里的邻接权重
      let rs = 0, r1 = 0, r2 = 0;
      for (const [id] of (adj.get(n.id) || [])) {
        const k = nbyId.get(id);
        if (!k) continue;
        if (k.hop === 0) rs++;
        else if (k.hop === 1) r1++;
        else if (k.hop === 2) r2++;
      }
      const rich = 3 * rs + 2 * r1 + r2;
      list.push({ i, rich, nodeId: n.id });
    }
    list.sort((p2, q2) => q2.rich - p2.rich);
    SPOT.list = list;
    SPOT.cur = -1; SPOT.nodeId = ''; SPOT.start = now - SPOT_PERIOD; SPOT.level = 0;
  }
  if (!SPOT.list.length) {
    // 这一轮没有可点亮的片段（例如结果全是 Hindsight）：把 key 放开，后续帧再试
    SPOT.key = ''; SPOT.cur = -1; SPOT.nodeId = ''; SPOT.level = 0; return;
  }
  let el = now - SPOT.start;
  if (SPOT.cur < 0 || el >= SPOT_PERIOD) {
    const prev = SPOT.cur;
    // 候选 = 除当前这张以外的所有片段；相邻卡片降权到 30%（不是禁止）。
    // 因为同一时刻只会亮一张，"相邻不重叠"本来就不会同时闪；
    // 如果像之前那样硬性禁止相邻，3 张候选里中间那张永远轮不到。
    const use = prev < 0 ? SPOT.list : SPOT.list.filter((e) => e.i !== prev);
    let totalW = 0;
    for (const e of use) {
      const adj = prev >= 0 && Math.abs(e.i - prev) < 2;
      totalW += (1 + e.rich) * (adj ? .3 : 1);
    }
    let r = Math.random() * totalW;
    let pick = use[use.length - 1];
    for (const e of use) {
      const adj = prev >= 0 && Math.abs(e.i - prev) < 2;
      r -= (1 + e.rich) * (adj ? .3 : 1);
      if (r <= 0) { pick = e; break; }
    }
    SPOT.cur = pick.i;
    SPOT.nodeId = pick.nodeId;
    // 跨周期时把余量带过去，保持严格的 3s 节奏，不累积漂移
    SPOT.start = el >= SPOT_PERIOD ? SPOT.start + SPOT_PERIOD * Math.floor(el / SPOT_PERIOD) : now;
    el = now - SPOT.start;
  }
  let lv;
  if (el < SPOT_IN) lv = easeInOut(el / SPOT_IN);
  else if (el < SPOT_IN + SPOT_HOLD) lv = 1;
  else lv = 1 - easeInOut((el - SPOT_IN - SPOT_HOLD) / (SPOT_PERIOD - SPOT_IN - SPOT_HOLD));
  SPOT.level = clamp(lv);
}
/* 连线落点辉光：左栏与右侧共用同一套样式（呼吸光晕 + 小环 + 中心点）。
   之前右侧召回线走的是 PIPE 的另一套更大的光环，跟左边对不上，所以单独抽出来。 */
function drawLandingGlow(x, y, col, t, phase) {
  const pulse = breath(t, phase);
  const glowR = 17 + 5 * pulse;
  const g = ctx.createRadialGradient(x, y, 0, x, y, glowR);
  g.addColorStop(0, hexA(col, .36 + .22 * pulse));
  g.addColorStop(.38, hexA(col, .12 + .09 * pulse));
  g.addColorStop(1, hexA(col, 0));
  ctx.beginPath(); ctx.arc(x, y, glowR, 0, 6.283);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = hexA(col, .28 + .14 * pulse); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 6.283); ctx.stroke();
  ctx.fillStyle = hexA(col, .70);
  ctx.beginPath(); ctx.arc(x, y, 1.4, 0, 6.283); ctx.fill();
}
/* ---------------- 主循环 ---------------- */

/* ===== 板块 → 星云 / 管线 / 证据 / 拼上下文：按 panel-links-preview 的方案渲染 =====
   写入：实线 + 彗尾粒子朝内 + 星云入口呼吸环
   召回：虚线 + 彗尾粒子朝外 + 球面切口弧
   query 芯片：左侧竖条 + 右侧输出点 + 呼吸外发光 */
function drawBoardLinks(t) {
  const P0 = nodes;
  if (!P0 || !P0.length || P0[0].sx === undefined) return;
  const TAU = 6.283185307;
  const PTS = P0.map(n => ({ x: n.sx, y: n.sy, hop: n.hop }));
  const a = S.anim;
  const el = a ? (performance.now() - a.t0) / 1000 : 99;

  const ringPoint = (deg) => {
    const R = Math.min(NET.w, NET.h) * .40, ang = deg * Math.PI / 180;
    return { x: NET.cx + Math.cos(ang) * R, y: NET.cy + Math.sin(ang) * R };
  };
  // 落点优先吸到「休眠」节点上：点亮节点（hop 0/1/2）正被用户盯着看，
  // 连线头和彗尾粒子落上去会把它盖住。外圈壳层本来就是暗点，落上去几乎无损。
  // 外壳半径每帧只算一次：cloudEdgeF 一帧会被调用 20 多次，之前每次都重扫 28k 个点。
  let rMaxAll = 1;
  for (const p of PTS) { const r = Math.hypot(p.x - NET.cx, p.y - NET.cy); if (r > rMaxAll) rMaxAll = r; }
  const cloudEdgeF = (ideal, maxX) => {
    const rMax = rMaxAll;
    const rMin = rMax * .78;
    const okX = p => (maxX === undefined || p.x <= maxX);
    // 两轮筛选：先只要休眠节点，实在没有再退回全部节点
    const pick = (preferAsleep) => {
      let best = null, bd = 1e18;
      for (const p of PTS) {
        const r = Math.hypot(p.x - NET.cx, p.y - NET.cy);
        if (r < rMin) continue;
        if (preferAsleep && p.hop <= 2) continue;
        if (!okX(p)) continue;
        const d = (p.x - ideal.x) ** 2 + (p.y - ideal.y) ** 2;
        if (d < bd) { bd = d; best = p; }
      }
      return best;
    };
    let best = pick(true) || pick(false);
    if (!best) best = ideal;
    // 落点统一收窄到「暗点外壳带」的中线：外缘 rMax、内缘 rMin = 0.78·rMax，
    // 中线 = (rMax + rMin) / 2 ≈ 0.89·rMax。所有连线都用同一半径，
    // 左右天然对称，也不会再贴在壳层最外沿的暗点上。
    const dx = best.x - NET.cx, dy = best.y - NET.cy, L = Math.hypot(dx, dy) || 1;
    const k = (rMax * .89) / L;
    return { x: NET.cx + dx * k, y: NET.cy + dy * k };
  };
  const bez = (p0, p1, p2, p3, k) => {
    const mk = 1 - k;
    return {
      x: mk * mk * mk * p0.x + 3 * mk * mk * k * p1.x + 3 * mk * k * k * p2.x + k * k * k * p3.x,
      y: mk * mk * mk * p0.y + 3 * mk * mk * k * p1.y + 3 * mk * k * k * p2.y + k * k * k * p3.y,
    };
  };
  const polyPoint = (pts, u) => {
    const seg = []; let L = 0;
    for (let i = 1; i < pts.length; i++) {
      const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      seg.push(d); L += d;
    }
    let target = u * L;
    for (let i = 0; i < seg.length; i++) {
      if (target <= seg[i] || i === seg.length - 1) {
        const k = seg[i] ? Math.min(1, target / seg[i]) : 0;
        return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * k, y: pts[i].y + (pts[i + 1].y - pts[i].y) * k };
      }
      target -= seg[i];
    }
    return pts[pts.length - 1];
  };
  const topEntry = (lk) => {
    const x = clamp(lk.from.x, NET.x + 90, NET.x + NET.w * .62);
    return cloudEdgeF({ x, y: NET.cy - Math.min(NET.w, NET.h) * .30 });
  };
  const ctrlFor = (lk, b) => {
    const A = lk.from, off = lk.dir === 'in' ? 0 : 12;
    if (lk.side === 'L') {
      const c1 = { x: A.x + 18 + off * .5, y: A.y + (b.y - A.y) * .14 };
      const c2 = { x: clamp(NET.x + 20 + off, NET.x + 4, b.x - 20), y: b.y };
      return [c1, c2];
    }
    if (lk.side === 'R') {
      // 右栏（数据链）→ 星云：两条线共用同一形状的控制点，
      // 只随端点整体上下平移 —— 这样它们全程等距，是真正的平行双线。
      const kx = clamp(Math.abs(A.x - b.x) * .38, 16, 96);
      const kx2 = clamp(Math.abs(A.x - b.x) * .24, 10, 56);
      const c1 = { x: A.x - kx, y: A.y + (b.y - A.y) * .12 };
      const c2 = { x: b.x + kx2, y: b.y };
      return [c1, c2];
    }
    const band = NET.y - 26 - off * .6;
    return [{ x: A.x + off * .3, y: band }, { x: b.x + off * .4, y: band }];
  };

  // ---- 左栏 6 卡 × 写入/召回 ----
  const rail = S.railRects || [];
  const LINKS = [];
  rail.forEach((r, i) => {
    const y = r.y + r.h / 2;
    // 星云落点：以星云中心为基准，12 条全部向左侧中间（180°）收窄；
    // 两组都按「卡片从上到下 → 落点从高到低」单调排列（角度递减），这样线不会互相穿插；
    // 相邻 2.5° 均匀铺开，配合下方 used 避让保证落点间距不重合
    const po = Math.min(16, Math.max(10, r.h * .2));   // 出入端口各自的垂直偏移
    LINKS.push({ from: { x: r.x + r.w, y: y - po }, col: r.col, side: 'L', dir: 'in', theta: 178.75 - i * 2.5 });
    LINKS.push({ from: { x: r.x + r.w, y: y + po }, col: r.col, side: 'L', dir: 'out', theta: 193.75 - i * 2.5 });
  });

  /* ---- 右侧 8 条线统一排布 ----
     右侧同时有「数据链 4 张小卡」和「召回片段 4 张小卡」两组线（各 4 条）。
     之前两组各按自己的角度铺，落点混在一起就互相穿插。
     现在把所有右侧锚点**按源 y 排序**后，在右外壳上均匀分配角度：
     同一半径 → 同一弧长间距；源在上→落点在上，源在下→落点在下，8 条线不会交叉。 */
  // 落点间距与左栏完全一致：左栏 12 条是按「弧上 40px 一格」铺的，这里用同一间距，
  // 换算成角度就是 stepRad = 40 / 中线半径，8 条 → 总张角 7 格。
  const midRadius = Math.max(1, rMaxAll * .89);
  S.__midR = midRadius;   // 中线半径，供需要时复用
  const stepRad = 40 / midRadius;
  // 右侧 8 个落点直接取精确圆弧（中线半径），不再吸附到最近节点 ——
  // 吸附会把角度带偏，间距就变得忽宽忽窄；左栏是先吸附再重新等距铺开的，
  // 走的是"等弧长"，所以这里也用纯几何点，才能和左栏间距一致。
  const arcAt = (th) => ({ x: NET.cx + Math.cos(th) * midRadius, y: NET.cy + Math.sin(th) * midRadius });
  const rightPlan = (() => {
    const items = [];
    (S.chainRows || []).forEach((row) => items.push({ y: row.y, kind: 'chain', col: row.col }));
    const nR = Math.min(((S.anim && S.anim.results) || []).length, CARD_COUNT);
    for (let i = 0; i < nR; i++) items.push({ y: cardMid(i), kind: 'recall', i, col: cardTint(i) });
    items.sort((p, q) => p.y - q.y);
    const n = items.length;
    const half = clamp((stepRad * Math.max(0, n - 1)) / 2, .12, 1.1);
    items.forEach((it, k) => { it.theta = n > 1 ? -half + (2 * half * k) / (n - 1) : 0; });
    return items;
  })();
  // ---- 右栏「数据链」4 张小卡 ↔ 星云：每张卡一条**单向实线** ----
  // 卡片之间的数据关系是"这张图怎么铺出来的"（来源 / 分层 / 边 / 活性），
  // 按连线协议：单向通信只画一条实线；颜色取该卡自己的颜色。
  // 起点在每张小卡**自己的左缘**（不是框体边），落点吸到右外壳中线；
  // 4 个落点按行序扇开（-24°…+24°），出口/入口都水平，四条线不交叉。
  {
    // 落点回到「每张小卡左侧边缘的竖直中点」：卡片左缘 x = CHAIN_BOX.x + 12，
    // 竖直中点就是行中心 y。标签右侧那套空档锚点已撤销。
    rightPlan.filter((it) => it.kind === 'chain').forEach((it) => {
      LINKS.push({
        from: { x: CHAIN_BOX.x + 12, y: it.y },
        col: it.col,
        side: 'R', dir: 'in',
        theta: it.theta * 180 / Math.PI,
        _target: arcAt(it.theta),
      });
    });
  }

  // ---- 顶部管线 / 证据 / 拼上下文：折线 ----
  const st = S.stageRects || [];
  const PIPE = [];
  let Q = null, lane1 = 0, lane2 = 0;
  if (st.length === 4) {
    const box = k => ({ x: st[k].x, w: st[k].w, cx: st[k].x + st[k].w / 2, top: st[k].y, bot: st[k].y + st[k].h, cy: st[k].y + st[k].h / 2 });
    const E = box(0), H = box(1), B = box(2), R = box(3);
    Q = { x: RET.x + 16, y: RET.y + 44, w: 78, h: 28 };   // 底边不动，上边界再上抬 5px
    lane1 = Q.y - 4;                   // 查询→EMBED 车道
    lane2 = Q.y + Q.h + 4;             // 查询→BM25 车道
    const busA = E.top - 8;            // 向量臂总线（HNSW→RRF）
    const busB = E.top - 16;           // 词法臂总线（BM25→RRF）
    // 两条线从芯片右缘出发，平行向右，再各自垂直落进 EMBED / BM25
    const qMid = Q.y + Q.h / 2;
    lane1 = Q.y + Q.h / 2; lane2 = RET.y + 60;
    PIPE.push({ pts: [{ x: Q.x + Q.w, y: lane1 }, { x: E.cx, y: lane1 }, { x: E.cx, y: E.top - 1 }], col: C.cyan });
    PIPE.push({ pts: [{ x: Q.x + Q.w, y: qMid }, { x: Q.x + Q.w + 14, y: lane2 }, { x: B.cx - 22, y: lane2 }, { x: B.cx - 22, y: B.top - 1 }], col: C.cyan });
    PIPE.push({ pts: [{ x: E.x + E.w + 1, y: E.cy - 2.6 }, { x: H.x - 1, y: H.cy - 2.6 }], col: C.cyan });
    PIPE.push({ pts: [{ x: H.x - 1, y: H.cy + 2.6 }, { x: E.x + E.w + 1, y: E.cy + 2.6 }], col: C.violet, rev: true });
    PIPE.push({ pts: [{ x: H.cx, y: H.top - 1 }, { x: H.cx, y: busA }, { x: R.cx - 22, y: busA }, { x: R.cx - 22, y: R.top - 1 }], col: C.violet });
    PIPE.push({ pts: [{ x: B.cx, y: B.top - 1 }, { x: B.cx, y: busB }, { x: R.cx, y: busB }, { x: R.cx, y: R.top - 1 }], col: C.lime });
    PIPE.push({ pts: [{ x: R.cx + 22, y: R.top - 1 }, { x: R.cx + 22, y: busB - 10 }, { x: B.cx + 22, y: busB - 10 }, { x: B.cx + 22, y: B.top - 1 }], col: C.amber });
    // RRF → 星云（整条管线的出口）
    LINKS.push({ from: { x: R.cx, y: R.bot }, col: C.amber, side: 'T', dir: 'in' });
  }

  // 星云 → 召回卡片：按**真实召回条数**连线（实线、粒子向内流；端点落在小卡左缘）
  rightPlan.filter((it) => it.kind === 'recall').forEach((it) => {
    const pt = arcAt(it.theta);
    PIPE.push({ col: it.col, neb: pt, pts: [pt, { x: CARDS.x + 12, y: cardMid(it.i) }] });
  });
  // 召回片段 → 拼上下文：选中的片段拼进上下文（纵向汇流）
  PIPE.push({
    col: C.amber,
    pts: [
      { x: CARDS.x + CARDS.w - 46, y: CARDS.y + CARDS.h + 1 },
      { x: CARDS.x + CARDS.w - 46, y: CTX.y - 8 },
      { x: CTX.x + CTX.w - 46, y: CTX.y - 8 },
      { x: CTX.x + CTX.w - 46, y: CTX.y + 1 },
    ],
  });
  // 数据链 → 召回片段 / 拼上下文：库口统计是这两块的上游。
  // 走线按「从框体右侧出线」：右缘出来 → 沿右栏外侧的走线道（+12px）垂直向下
  // → 下面框体的右缘接入；不再从数据链框体正下方钻出来、也不压住卡片区。
  {
    const busX = CHAIN_BOX.x + CHAIN_BOX.w + 12;
    const y0 = CHAIN_BOX.y + Math.round(CHAIN_BOX.h * .55);   // 右缘出线高度
    const yIn = CARDS.y + 30;                                  // 并入召回片段
    const y1 = CTX.y + Math.round(CTX.h * .45);                // 汇入拼上下文
    PIPE.push({
      col: C.amber,
      pts: [
        { x: CHAIN_BOX.x + CHAIN_BOX.w, y: y0 },
        { x: busX, y: y0 },
        { x: busX, y: y1 },
        { x: CTX.x + CTX.w, y: y1 },
      ],
    });
    // 支路：在召回片段右侧并入（起点落在主干上，自动形成 T 形接点）
    PIPE.push({
      col: C.amber,
      pts: [
        { x: busX, y: yIn },
        { x: CARDS.x + CARDS.w, y: yIn },
      ],
    });
  }

  // ---- query 芯片 ----
  if (Q) {
    const pulse = .5 + .5 * Math.sin(t * 2.2);
    const cX = Q.x + Q.w / 2, cY = Q.y + Q.h / 2;
    const g = ctx.createRadialGradient(cX, cY, 2, cX, cY, 48);
    g.addColorStop(0, hexA(C.cyan, .16 + .10 * pulse)); g.addColorStop(1, hexA(C.cyan, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cX, cY, 48, 0, TAU); ctx.fill();
    rr(Q.x, Q.y, Q.w, Q.h, 6);
    ctx.fillStyle = 'rgba(11,20,31,.92)'; ctx.fill();
    ctx.strokeStyle = hexA(C.cyan, .55 + .25 * pulse); ctx.lineWidth = 1.2; ctx.stroke();
    // 左侧标记：带闪烁光晕的光点（原来是竖线）
    const dp = .5 + .5 * Math.sin(t * 3.2);
    const dX = Q.x + 12, dY = Q.y + Q.h / 2;
    const dR = 9 + 3 * dp;
    const dg = ctx.createRadialGradient(dX, dY, 0, dX, dY, dR);
    dg.addColorStop(0, hexA(C.cyan, .58 + .32 * dp));
    dg.addColorStop(.38, hexA(C.cyan, .18 + .14 * dp));
    dg.addColorStop(1, hexA(C.cyan, 0));
    ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(dX, dY, dR, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(dX, dY, 2.6, 0, TAU);
    ctx.fillStyle = hexA(C.cyan, .78 + .22 * dp); ctx.fill();
    txt('H-C-D', Q.x + 25, Q.y + 18, MONO(600, 11.5), '#eaf2fb');
  }
  function w0(q) { return Math.max(80, RET.x + RET.w - 240 - (q.x + q.w + 10)); }

  // ---- 折线（管线 / 证据 / 拼上下文）----
  PIPE.forEach((p, i) => {
    const pts = p.pts.slice();
    if (p.deg !== undefined) {
      const edge = cloudEdgeF(ringPoint(p.deg));
      if (p.rev || p.edgeEnd) pts[pts.length - 1] = edge; else pts[0] = edge;
    }
    if (p.horiz) {
      const refY = p.yRef !== undefined ? p.yRef : (p.rev ? pts[pts.length - 1].y : pts[0].y);
      for (let k = 0; k < pts.length; k++) pts[k] = { x: pts[k].x, y: refY };
    }
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    pts.forEach((q, k) => (k ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
    if (p.dashed) ctx.setLineDash([7, 5]);
    ctx.strokeStyle = hexA(p.col, p.dashed ? .14 : .22);
    ctx.lineWidth = p.dashed ? 1.1 : 1.2; ctx.stroke();
    ctx.setLineDash([]);
    for (let j = 0; j < 2; j++) {
      const u0 = (t * .34 + j * .5 + i * .19) % 1;
      const u = p.rev ? 1 - u0 : u0;
      const pos = polyPoint(pts, u);
      for (let b = 4; b >= 1; b--) {
        const q = polyPoint(pts, p.rev ? Math.min(1, u + b * .012) : Math.max(0, u - b * .012));
        ctx.beginPath(); ctx.arc(q.x, q.y, 2.4 - b * .35, 0, TAU);
        ctx.fillStyle = hexA(p.col, .34 - b * .06); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(pos.x, pos.y, 3.2, 0, TAU);
      ctx.fillStyle = hexA(p.col, .14); ctx.fill();
      ctx.beginPath(); ctx.arc(pos.x, pos.y, 1.5, 0, TAU);
      ctx.fillStyle = hexA(p.col, .95); ctx.fill();
    }
    const ends = [pts[0], pts[pts.length - 1]];
    // 与星云接触的那一端：与左栏同一套呼吸光晕（不再用更大更亮的一版）
    if (p.neb || p.deg !== undefined) {
      const nb = p.neb ? p.neb : ((p.rev || p.edgeEnd) ? pts[pts.length - 1] : pts[0]);
      drawLandingGlow(nb.x, nb.y, p.col, t, i * .9);
    }
    ends.forEach(pt => {
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3.4, 0, TAU);
      ctx.fillStyle = hexA(p.col, .12); ctx.fill();
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.2, 0, TAU);
      ctx.fillStyle = hexA(p.col, .85); ctx.fill();
    });
    ctx.restore();
  });

  // ---- 左栏 12 条落点：先全部吸附到外壳，再按 y 排序 + 等距重排 ----
  // 吸附会打乱上下顺序（外壳节点位置不规则，常有多个理想点吸到同一颗节点），
  // 所以先按 y 排序，再把 12 个落点在外壳弧上均匀铺开：顺序不交叉、间距一致。
  {
    const railLinks = LINKS.filter(lk => lk.side === 'L');
    const maxX = NET.x + NET.w * .42;
    const ps = railLinks.map(lk => cloudEdgeF(ringPoint(lk.theta), maxX));
    ps.sort((p, q) => p.y - q.y);
    const Rm = ps.reduce((s, p) => s + Math.hypot(p.x - NET.cx, p.y - NET.cy), 0) / ps.length;
    let yMin = ps[0].y, yMax = ps[ps.length - 1].y;
    // 沿外壳弧等弧长铺开：间距约等于一个休眠光点直径（44px 内自适应），
    // 用角度而不是 y 来分布，避免拉到弧顶/弧底时 x 塌到星云中心
    const n = ps.length;
    const GAP = Math.min(40, (Rm * 2.4) / (n - 1));     // 最多铺 ±69°
    const dTh = (GAP * (n - 1)) / Rm;
    for (let k = 0; k < n; k++) {
      const th = Math.PI + dTh / 2 - (dTh * k) / (n - 1);
      ps[k] = { x: NET.cx + Rm * Math.cos(th), y: NET.cy + Rm * Math.sin(th) };
    }
    railLinks.forEach((lk, k) => { lk._target = ps[k]; });
    S.linkTargets = ps.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) }));
  }

  // ---- 左栏链路（三次贝塞尔，写入/召回两套通道）----
  // 只允许画在「左栏右缘 → 证据面板左缘」这条走廊里，越界一律裁掉
  const used = [];
  LINKS.forEach((lk, i) => {
    ctx.save();
    if (lk.side === 'L') {
      ctx.beginPath();
      ctx.rect(0, RET.y - 6, CARDS.x - 2, CTX.y - RET.y + 12);
      ctx.clip();
    } else if (lk.side === 'R') {
      // 右走廊：从星云中心线到数据链卡左缘，别的区域一律不画
      ctx.beginPath();
      // 端点就在卡片左缘（CHAIN_BOX.x + 12），裁剪框必须把这一小段也包进去，
      // 否则线会被裁在框体外侧 10px，看起来"没接上卡片"。
      ctx.rect(NET.cx, RET.y - 6, CHAIN_BOX.x + 15 - NET.cx, CTX.y - RET.y + 12);
      ctx.clip();
    }
    let target = lk.side === 'T' ? topEntry(lk)
      : (lk._target || cloudEdgeF(ringPoint(lk.theta), lk.side === 'L' ? NET.x + NET.w * .42 : undefined));
    // 落点避让：与已有端点太近就沿圆周错开，避免叠成一条珠子（左栏 12 条已在上面排好序，不再二次挪动）
    let guard = 0;
    while (!lk._target && used.some(u => Math.hypot(u.x - target.x, u.y - target.y) < 11) && guard < 14) {
      const ang = Math.atan2(target.y - NET.cy, target.x - NET.cx) + .06;
      const R0 = Math.hypot(target.x - NET.cx, target.y - NET.cy);
      target = { x: NET.cx + Math.cos(ang) * R0, y: NET.cy + Math.sin(ang) * R0 };
      guard++;
    }
    used.push(target);
    const c = ctrlFor(lk, target);
    const c1 = c[0], c2 = c[1];
    const isIn = lk.dir === 'in';
    // 板块侧的出/入端口：一个实心点 + 一圈淡光，两个端口上下分开、互不重叠
    ctx.beginPath(); ctx.arc(lk.from.x, lk.from.y, 7, 0, TAU);
    ctx.fillStyle = hexA(lk.col, .13); ctx.fill();
    ctx.beginPath(); ctx.arc(lk.from.x, lk.from.y, isIn ? 2.6 : 2.1, 0, TAU);
    ctx.fillStyle = hexA(lk.col, isIn ? .92 : .62); ctx.fill();
    if (!isIn) { ctx.beginPath(); ctx.arc(lk.from.x, lk.from.y, 4.2, 0, TAU); ctx.strokeStyle = hexA(lk.col, .5); ctx.lineWidth = 1; ctx.stroke(); }
    ctx.save();
    ctx.setLineDash(isIn ? [] : [7, 5]);
    ctx.beginPath();
    ctx.moveTo(lk.from.x, lk.from.y);
    ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, target.x, target.y);
    ctx.strokeStyle = hexA(lk.col, isIn ? .20 : .14);
    ctx.lineWidth = isIn ? 1.4 : 1.1;
    ctx.stroke();
    ctx.restore();

    const NP = isIn ? 4 : 3;
    for (let p = 0; p < NP; p++) {
      const raw = ((t * .22 + p / NP + i * .07) % 1);
      const k = isIn ? raw : 1 - raw;
      const pt = bez(lk.from, c1, c2, target, k);
      // 与四段管线上方同一套：4 段彗尾
      for (let b = 4; b >= 1; b--) {
        const kk = k - (isIn ? b : -b) * .012;
        if (kk < 0 || kk > 1) break;
        const q = bez(lk.from, c1, c2, target, kk);
        ctx.beginPath();
        ctx.arc(q.x, q.y, 2.4 - b * .35, 0, TAU);
        ctx.fillStyle = hexA(lk.col, .34 - b * .06); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3.2, 0, TAU);
      ctx.fillStyle = hexA(lk.col, .14); ctx.fill();
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 1.5, 0, TAU);
      ctx.fillStyle = hexA(lk.col, .95); ctx.fill();
    }

    // 星云入口：写入呼吸环 / 召回球面切口弧
    ctx.save();
    ctx.translate(target.x, target.y);
    const pulse = .5 + .5 * Math.sin(t * 3 + i);
    // 接触光晕（左栏 12 条链路落点）
    const glowR = 17 + 5 * pulse;
    const glowG = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
    glowG.addColorStop(0, hexA(lk.col, .36 + .22 * pulse));
    glowG.addColorStop(.38, hexA(lk.col, .12 + .09 * pulse));
    glowG.addColorStop(1, hexA(lk.col, 0));
    ctx.beginPath(); ctx.arc(0, 0, glowR, 0, TAU);
    ctx.fillStyle = glowG; ctx.fill();
    if (isIn) {
      drawLandingGlow(0, 0, lk.col, t, i);
    } else {
      const ea = Math.atan2(target.y - NET.cy, target.x - NET.cx);
      // 注意：此处 ctx 已 translate 到 target，圆弧圆心必须减掉该平移量，否则会画到面板外
      const acx = NET.cx - target.x, acy = NET.cy - target.y;
      const rr0 = Math.hypot(target.x - NET.cx, target.y - NET.cy);
      // 弧盖只做「贴着球面的小月牙」（约 12px 长），避免相邻触点的弧连成一条线
      const half = Math.min(.06, 4 / Math.max(1, rr0));
      ctx.strokeStyle = hexA(lk.col, .30 + .18 * pulse);
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(acx, acy, rr0 - 3.2, ea - half, ea + half);
      ctx.strokeStyle = hexA(lk.col, .26 + .14 * pulse); ctx.lineWidth = 1.1; ctx.stroke();
      ctx.fillStyle = hexA(lk.col, .55);
      ctx.beginPath(); ctx.arc(0, 0, 1.3, 0, TAU); ctx.fill();
    }
    ctx.restore();
    ctx.restore();
  });
}

function frame() {
  // 冷启动加载态：分阶段文案，让用户区分「本地卡了」还是「在等外脑」。
  //   booted=false → 「正在唤醒本地记忆 …」
  //   booted=true 但 Hindsight 还没连上 → 「本地记忆已就绪，正在连接外脑 …」
  //   booted=true 且外脑连上（或纯 local 兜底超时）→ 淡出。
  if (!S.__ovDone) {
    const ov = document.getElementById('loading-overlay');
    if (ov) {
      const txt = document.getElementById('loading-text');
      const sub = document.getElementById('loading-sub');
      if (S.booted) {
        // 记录 booted 时刻，用于「外脑迟迟不来」时的强制淡出兜底
        if (!S.__ovBootAt) S.__ovBootAt = performance.now();
        const waitingHs = S.db === false;
        const tooLong = performance.now() - S.__ovBootAt > 3000;
        if (waitingHs && !tooLong) {
          // 本地已就绪，还在等 Hindsight 后台探测
          if (txt) txt.textContent = '本地记忆已就绪，正在连接外脑 …';
          if (sub) sub.textContent = 'Hindsight 语义服务';
        } else {
          // 外脑已连上，或纯 local 模式等满 3s 兜底，淡出
          ov.classList.add('done');
          S.__ovDone = true;
          setTimeout(() => { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 500);
        }
      }
    } else {
      S.__ovDone = true;
    }
  }
  const t = (performance.now() - S.lastT) / 1000;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // 网格
  ctx.strokeStyle = 'rgba(90,150,190,.05)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // 每一块单独兜底：任何一块抛错都不该让整屏变黑（曾经因为 layers 缺失把画面清空过）
  // err 同时存下完整堆栈，后面会画到面板上，免得只能靠 DevTools 才能看到
  const safe = (fn, name) => {
    try { fn(t); } catch (err) {
      if (!S.errs[name]) {
        S.errs[name] = 1;
        S.errDetail[name] = (err && err.stack) || String(err);
        console.error('[panel] ' + name, err);
      }
    }
  };
  // 召回片段轮换点亮：先推进状态，dynamics/cards 都在同一帧读到同一 level
  if (S.anim) { try { updateSpotlight(performance.now()); } catch (e) { SPOT.level = 0; } }
  else { SPOT.level = 0; SPOT.cur = -1; }
  safe(header, 'header');
  safe(storage, 'storage');
  safe(dynamics, 'dynamics');
  safe(pipeline, 'pipeline');
  safe(chainCards, 'chain');
  safe(cards, 'cards');
  safe(context, 'context');
  safe(drawBoardLinks, 'links');
  // 提示条必须画在星云之后：先前放在 dynamics 之前，会被星图的底色整块盖掉（等于没画）。
  // 注意 S.db 的语义是「Hindsight 可用」，不是「数据库连上了」：
  // 纯本地模式（mode=local）本来就没有 Hindsight，不该弹红色"库未连接"吓人，
  // 只在 hybrid 掉线时才报错。
  if (S.mode !== 'local' && S.db === false) safe(dbBanner, 'dbBanner');
  else if (S.mode === 'local' && S.counts && S.counts.units === 0) safe(emptyBanner, 'emptyBanner');
  safe(footer, 'footer');
  safe(diagBanner, 'diag');
  requestAnimationFrame(frame);
}

/* 渲染异常面板：哪个区块抛错就把它画出来（带前几行堆栈），不用开 DevTools 也能定位 */
function diagBanner(t) {
  const keys = Object.keys(S.errs);
  if (!keys.length) return;
  const x = NET.x + 14, w = NET.w - 28;
  let y = NET.y + 62;
  const PL = 11;
  for (const name of keys.slice(0, 4)) {
    const detail = String(S.errDetail[name] || '(无堆栈)').split('\n').slice(0, 6).map(s => s.trim()).filter(Boolean);
    const bh = 30 + detail.length * 14;
    rr(x, y, w, bh, 8);
    ctx.fillStyle = 'rgba(248,113,113,.10)'; ctx.fill();
    ctx.strokeStyle = hexA(C.red, .55); ctx.lineWidth = 1; ctx.stroke();
    txt(`渲染异常 · ${name}`, x + 12, y + 19, F(700, 12), hexA(C.red, .98));
    txt('该区块已跳过绘制', x + w - 12, y + 19, F(400, 10), hexA(C.dim, .95), 'right');
    detail.forEach((s, i) => {
      txt(s.slice(0, 150), x + 12, y + 36 + i * 14, MONO(400, PL - 1.5), hexA(C.dim, .9));
    });
    y += bh + 8;
  }
  txt('F12 → Console 可看完整 trace', x + 12, y + 4, F(400, 10), hexA(C.faint, .9));
}

fit();
requestAnimationFrame(frame);

/* 交互 */
// ESC 关闭 / 双击全屏已在页脚撤掉：面板跑在 iframe 里，window.close() 是空操作，
// requestFullscreen 又会被 permissions policy 拒（client.js 的 allow 列表没有 fullscreen）。
// 留着监听器只会让人以为有快捷键。
cv.addEventListener('click', async ev => {
  const r = cv.getBoundingClientRect();
  const px = (ev.clientX - r.left) / r.width * W;
  const py = (ev.clientY - r.top) / r.height * H;
  // 点「试一次召回」按钮：从历史查询池里随机挑一条真跑
  const qb = S.qbtn || { x: 1460, y: 96, w: 116, h: 42 };
  if (px > qb.x && px < qb.x + qb.w && py > qb.y && py < qb.y + qb.h) {
    runOneRecall({ alertOnError: true });
  }
  // 点「🧹 压缩库」按钮：POST /compact
  const cb = S.cbtn;
  if (cb && px > cb.x && px < cb.x + cb.w && py > cb.y && py < cb.y + cb.h) {
    runCompact();
  }
});

/* 真跑一次召回：从历史查询池里随机挑一条。
   面板打开时会自动调用一次（见文件末尾的 autoRecallOnce），
   所以不用担心"刚打开全是 0 和示例卡"被误认为坏了。 */
async function runOneRecall(opts) {
  if (S.recalling) return false;
  // 冷却期内直接忽略：连点会让一串召回连续打 DB 连接池（01:17 池满超时就是这么来的）
  if (performance.now() < (S.recallCoolUntil || 0)) return false;
  S.recalling = true;
  try {
    let pool = S.queryPool;
    if (!pool || !pool.length) {
      const qj = await (await fetch('/queries')).json();
      pool = S.queryPool = (qj.queries || []).filter(Boolean);
    }
    if (!pool.length) throw new Error('没有可用的历史查询');
    // 查询长短直接决定种子数量：「我叫什么」这种 4 字查询只有 4 个起点，
    // 召回结果看着就像“数据不见了”。这里优先从前一半（信息量更大的）里随机挑，
    // 既保留随机性，又不会一打开面板就抽到最瘦的那条。
    const ranked = pool.slice().sort((x, y) => String(y).length - String(x).length);
    const head = ranked.slice(0, Math.max(1, Math.ceil(ranked.length / 2)));
    const q = head[(Math.random() * head.length) | 0];
    S.pendingAt = performance.now();
    const resp = await fetch('/recall?q=' + encodeURIComponent(q));
    if (!resp.ok) throw new Error(await resp.text());
    return true;
  } catch (err) {
    S.pendingAt = 0;
    S.lastRecallError = err.message || String(err);
    if (opts && opts.alertOnError) alert('召回失败：' + S.lastRecallError);
    return false;
  } finally {
    S.recalling = false;
    // 无论成败都留 2s 冷却：给连接池喘息，也给按钮一个明确的「稍候」反馈
    S.recallCoolUntil = performance.now() + 2000;
  }
}

/* 手动压缩：POST /compact。旧版服务没有该路由（404）时提示重启插件生效。
   另外引擎自带自动压缩（追加行数超过存活×2.5 时延迟 5s 自动清理），按钮只是手动兜底。 */
async function runCompact() {
  if (S.compacting) return;
  if (!confirm('压缩记忆库文件？\n\n清理追加历史：磁盘显著变小、下次启动明显变快。\n压缩只重写存活集（亚秒级），期间读写不受影响。')) return;
  S.compacting = true;
  try {
    const resp = await fetch('/compact', { method: 'POST' });
    if (resp.status === 404) {
      alert('当前运行的服务还是旧版本，没有 /compact 接口。\n插件文件已更新——重启 DSH 后即可使用（重启时也会自动清理一次）。');
      return;
    }
    if (!resp.ok) throw new Error(await resp.text());
    const r = await resp.json();
    const b = r.before || {}, a = r.after || {};
    alert(`压缩完成（${r.durationMs}ms）\n\n节点文件行数：${b.nodeLines} → ${a.nodeLines}\n节点文件大小：${b.nodesMB}MB → ${a.nodesMB}MB\n\n下次启动会明显变快。`);
  } catch (err) {
    alert('压缩失败：' + (err.message || err));
  } finally {
    S.compacting = false;
  }
}

/* 打开面板自动跑一次召回：只在「服务已就绪 + 当前没有召回结果」时触发，
   失败就保持空闲（不弹窗、不重试），把错误留在 S.lastRecallError 里。 */
function autoRecallOnce() {
  if (S.__autoRecallTried) return;
  if (S.anim) return;                       // 服务端已带回上次结果，不用重跑
  if (!S.counts || !(S.counts.units > 0)) return;   // 空库没什么可召回的
  S.__autoRecallTried = true;
  runOneRecall({ alertOnError: false });
}

window.__S = S;
S.lastT = performance.now();
connect();
requestAnimationFrame(frame);
// 等服务把 /state 推下来之后再自动召回一次。
// /state 有 ~8.8MB、首帧可能要 1~2s，单次定时器太脆（上次就因为没等到 counts 而没触发），
// 这里改成每秒重试、最多 20 次，一旦真的触发或超过时限就停。
setTimeout(() => {
  let tries = 0;
  const iv = setInterval(() => {
    tries++;
    if (S.__autoRecallTried || tries > 20) { clearInterval(iv); return; }
    autoRecallOnce();
  }, 1000);
  autoRecallOnce();
}, 1200);

/* ============================================================
   新版状态指示器（整合版保留）：模式徽标 / 额度 / worker / Hindsight
   这些是旧面板没有的新能力，作为 DOM 状态栏浮在 canvas 上方。
   ============================================================ */
const $ = id => document.getElementById(id);
function setDot(id, cls) { const el = $(id); if (el) el.className = 'dot ' + cls; }
// Hindsight 指示：由 SSE 帧即时驱动（不等 60s 轮询），也不受其它端点失败影响。
function applyHindsightUI(up, mode, bank) {
  const m = mode || (up ? 'hybrid' : 'local');
  const mb = $('tb-mode');
  if (mb) { mb.textContent = m; mb.className = 'badge ' + (m === 'hybrid' ? 'hybrid' : 'local'); }
  const hb = $('tb-hindsight');
  if (hb) { hb.textContent = up ? 'HINDSIGHT 已叠加' : 'Hindsight: 未接入'; hb.className = 'badge ' + (up ? 'hybrid' : 'off'); }
  if ($('tb-bank')) $('tb-bank').textContent = bank || '';
  if ($('sc-apc')) $('sc-apc').textContent = up ? '已连接' : '未接入';
  setDot('sc-apc-dot', up ? 'green' : 'gray');
}
// 顶栏版本号：服务端 /state.version 就是插件版本（server.js VERSION）
function setPluginVersion(v) {
  if (!v) return;
  S.version = String(v);
  const el = document.getElementById('tb-ver');
  if (el && el.textContent !== 'v' + v) el.textContent = 'v' + v;
}

async function refreshTopbar() {
  // 三路各自容错，避免某一端点慢/失败拖住整条状态栏
  const st = await fetch('/state').then(r => r.ok ? r.json() : null).catch(() => null);
  if (st && st.version) setPluginVersion(st.version);
  const ws = await fetch('/worker-settings').then(r => r.ok ? r.json() : null).catch(() => null);
  const q = await fetch('/quota-status').then(r => r.ok ? r.json() : null).catch(() => null);
  try {
    // 模式徽标（local/hybrid）+ Hindsight 叠加
    const up = !!(st && (st.hindsightAvailable || st.db));
    applyHindsightUI(up, st && st.mode, st && st.bank);

    // worker 状态（配置缺失显示未知，不能把 null 当开启）
    // 三态：已停用(灰) / 已启用·时段外待机(黄常亮) / 运行中(绿闪)
    // 用户选「手动时段」时，schedulerEnabled=true 只表示已启用；当前是否真在
    // 运行时段要看 on/off。auto 档脱离时段约束，视为随时可能运行。
    S.workerEnabled = ws && ws.available !== false ? (ws.schedulerEnabled !== false) : null;
    if (!ws || ws.available === false) {
      if ($('sc-worker')) $('sc-worker').textContent = '未知';
      setDot('sc-worker-dot', 'gray');
    } else if (ws.schedulerEnabled === false) {
      if ($('sc-worker')) $('sc-worker').textContent = '已停用';
      setDot('sc-worker-dot', 'gray');
    } else {
      const inWindow = (hhmm) => {
        const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
        return m ? (Number(m[1]) * 60 + Number(m[2])) : null;
      };
      const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      const onMin = inWindow(ws.on), offMin = inWindow(ws.off);
      let active;
      if (ws.mode === 'auto') {
        active = true; // 自动档脱离时段，随时可能调度
      } else if (onMin != null && offMin != null) {
        active = onMin <= offMin
          ? (nowMin >= onMin && nowMin < offMin)      // 同一天时段
          : (nowMin >= onMin || nowMin < offMin);     // 跨午夜时段（如 23:00-08:00）
      } else {
        active = true;
      }
      if ($('sc-worker')) $('sc-worker').textContent = active ? '运行中' : '待机';
      setDot('sc-worker-dot', active ? 'green' : 'amber');
    }

    // 额度状态：把「本地熔断」和「上游拒付」分开说，避免让人以为要充值
    if (q && q.available) {
      const free = q.errorsFreeHour || 0;
      const kind = q.kind || (free >= 3 ? 'quota' : (q.tripped ? 'trip' : null));
      if ($('sc-quota')) $('sc-quota').textContent =
        kind === 'quota' ? ('拒付 ' + free) : (kind === 'trip' ? '本地熔断' : '正常');
      setDot('sc-quota-dot', kind ? 'red' : 'green');
      const banner = $('quota-banner');
      if (banner) {
        if (!kind) {
          banner.style.display = 'none';
        } else {
          banner.className = kind === 'quota' ? 'kind-quota' : 'kind-trip';
          banner.textContent = kind === 'quota'
            ? ('⚠ Hindsight 额度/凭证异常：本小时上游拒付 ' + free + ' 次，后台 worker 已自动停止。充值或更换 key 后会自动恢复，无需手动操作。')
            : '⚠ 本地成本熔断：本小时/今日用量超过自设上限，后台 worker 已自动停止。这不是额度或 key 的问题，不需要充值；用量回落到上限内会自动恢复。';
          banner.style.display = 'block';
        }
      }
    } else {
      if ($('sc-quota')) $('sc-quota').textContent = '未知';
      setDot('sc-quota-dot', 'gray');
    }
  } catch {}
}
refreshTopbar();
setInterval(refreshTopbar, 60000);

// ── worker 调度设置面板 ──
let wsSettings = { available:false, schedulerEnabled:null, mode:'manual', on:'23:00', off:'08:00', autoThreshold:20 };
function renderWs() {
  const available = wsSettings.available !== false;
  const enabled = available && wsSettings.schedulerEnabled !== false;
  const m = wsSettings.mode === 'auto' ? 'auto' : 'manual';
  for (const id of ['ws-disable','ws-save','ws-manual','ws-auto']) { const el=$(id); if(el) el.disabled = !available; }
  if ($('ws-disable')) $('ws-disable').checked = available ? !enabled : false;
  if ($('ws-schedule-body')) $('ws-schedule-body').style.display = enabled ? 'block' : 'none';
  if ($('ws-manual')) $('ws-manual').classList.toggle('active', m === 'manual');
  if ($('ws-auto')) $('ws-auto').classList.toggle('active', m === 'auto');
  if ($('ws-on')) $('ws-on').value = wsSettings.on || '23:00';
  if ($('ws-off')) $('ws-off').value = wsSettings.off || '08:00';
  if ($('ws-thr')) $('ws-thr').value = wsSettings.autoThreshold || 20;
  if ($('ws-warn')) $('ws-warn').style.display = (m === 'auto') ? 'block' : 'none';
  const warn = $('ws-disable-warn');
  if (warn) {
    if (!available) { warn.style.display='block'; warn.textContent='worker 状态未知：请配置 MEMORY_NEBULA_HINDSIGHT_DIR 后重启服务。'; }
    else if (!enabled) { warn.style.display='block'; warn.textContent='已停用后台 worker：不再调度/烧钱；手动召回仍可用。'; }
    else warn.style.display='none';
  }
}
async function loadWs() {
  try { const r = await fetch('/worker-settings'); if (r.ok) { const j = await r.json(); if (j && j.mode) wsSettings = j; } } catch {}
  renderWs();
}
loadWs();
if ($('ws-btn')) $('ws-btn').addEventListener('click', () => $('ws-panel').classList.toggle('open'));

// ── Hindsight 连接设置（地址 + API Key；key 用 DPAPI 加密存本机，重启自动恢复）──
async function loadConn() {
  try {
    const r = await fetch('/connection-settings')
    if (!r.ok) return
    const j = await r.json()
    if ($('cn-url')) $('cn-url').value = j.hindsightUrl || ''
    if ($('cn-key')) $('cn-key').placeholder = j.hasKey ? `已保存 ${j.keyHint}（留空不修改）` : '留空=不使用鉴权'
    const hint = $('cn-hint')
    if (hint) {
      if (!j.hasKey) hint.textContent = '尚未配置 key。保存后会加密存在本机（仅当前 Windows 用户可解密），重启自动填充。'
      else if (j.source === 'env') hint.textContent = '当前 key 来自环境变量 MEMORY_NEBULA_HINDSIGHT_KEY（优先级最高）。'
      else if (j.source === 'vault') hint.textContent = `已加密保存在本机（${j.keyHint}），重启后自动填充。`
      else hint.textContent = 'key 仅本次运行有效（DPAPI 不可用），重启后需重新输入。'
    }
  } catch {}
}
loadConn();
if ($('cn-save')) $('cn-save').addEventListener('click', async () => {
  const hint = $('cn-hint')
  const keyEl = $('cn-key')
  const keyVal = (keyEl?.value || '').trim()
  const body = { hindsightUrl: ($('cn-url')?.value || '').trim() }
  // 有输入 → 保存新 key；留空且用户点了"清除"才提交空串。默认留空=不修改。
  if (keyVal) body.hindsightKey = keyVal
  try {
    const r = await fetch('/connection-settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    const j = await r.json()
    if (j.ok) {
      if (hint) {
        const conn = j.connected ? '连接正常' : '连接测试失败（检查地址/key）'
        hint.textContent = j.persisted
          ? `✅ 已加密保存到本机，${conn}。重启后自动填充。`
          : `⚠ ${conn}；保存未持久化：${j.persistError || 'DPAPI 不可用'}`
      }
      if (keyEl) keyEl.value = ''
      loadConn(); refreshTopbar()
    } else if (hint) hint.textContent = '保存失败：' + (j.error || 'unknown')
  } catch (e) { if (hint) hint.textContent = '保存失败：' + e.message }
});
// 清除已保存的 key（显式提交空串 → 服务端删掉 DPAPI 文件并清内存）
if ($('cn-clear')) $('cn-clear').addEventListener('click', async () => {
  if (!window.confirm('确认清除已保存的 Hindsight API Key？清除后需重新输入。')) return
  const hint = $('cn-hint')
  try {
    const r = await fetch('/connection-settings', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ hindsightKey: '' }),
    })
    const j = await r.json()
    if (j.ok) {
      if ($('cn-key')) $('cn-key').value = ''
      if (hint) hint.textContent = '已清除保存的 key。'
      loadConn(); refreshTopbar()
    } else if (hint) hint.textContent = '清除失败：' + (j.error || 'unknown')
  } catch (e) { if (hint) hint.textContent = '清除失败：' + e.message }
});

if ($('ws-manual')) $('ws-manual').addEventListener('click', () => { wsSettings.mode='manual'; renderWs(); });
if ($('ws-auto')) $('ws-auto').addEventListener('click', () => { wsSettings.mode='auto'; renderWs(); });
if ($('ws-disable')) $('ws-disable').addEventListener('change', async () => {
  const disable = $('ws-disable').checked;
  const msg = disable
    ? '确认完全停用后台 worker？\n\n停用后不再调度/消耗额度；手动召回仍可用。'
    : '确认重新启用后台 worker 调度？';
  if (!window.confirm(msg)) { $('ws-disable').checked = !disable; return; }
  wsSettings.schedulerEnabled = !disable;
  try {
    const r = await fetch('/worker-settings', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(wsSettings) });
    const j = await r.json();
    if (j.ok) { wsSettings = j.settings; renderWs(); }
    else { $('ws-disable').checked = !disable; if($('ws-disable-warn')){$('ws-disable-warn').textContent='保存失败：'+(j.error||'unknown');$('ws-disable-warn').style.display='block';} }
  } catch (e) { $('ws-disable').checked = !disable; }
});
if ($('ws-save')) $('ws-save').addEventListener('click', async () => {
  wsSettings.on = ($('ws-on')?.value||'').trim();
  wsSettings.off = ($('ws-off')?.value||'').trim();
  wsSettings.autoThreshold = parseInt(($('ws-thr')?.value||'20'),10) || 20;
  try {
    const r = await fetch('/worker-settings', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(wsSettings) });
    const j = await r.json();
    if (j.ok) { wsSettings = j.settings; renderWs(); if($('ws-hint'))$('ws-hint').textContent='✅ 已保存'; }
    else if($('ws-hint')) $('ws-hint').textContent='保存失败：'+(j.error||'unknown');
  } catch (e) { if($('ws-hint')) $('ws-hint').textContent='保存失败：'+e.message; }
});
</script>
