name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# Auth uses GitHub Actions OIDC: the runner identity proves ownership of the
# io.github.yb-zhai/* namespace, so no PAT or interactive login is needed.
#
# Triggers: a v* tag push (e.g. v1.3.0), or manual "Run workflow" from Actions.
# Prerequisite: npm package nebula-memory-mcp is published and its package.json
# mcpName matches server.json name (currently io.github.yb-zhai/nebula-memory).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        continue-on-error: true
        run: ./mcp-publisher publish